${EE_SIDE_PREFIX}_grasper_srv:
  ros__parameters:
    # The name of the controller,
    controller_name: ${EE_SIDE_PREFIX}_controller
    # Real joints that will be commanded 
    joint_names: 
      - ${EE_SIDE_PREFIX}_finger_joint

    # The finger is blocked (object, or a target it can't reach) when it lags the commanded
    # position of the controller by more than 'max_position_error' while it moved less than
    # 'stall_motion' in the last 'stall_time' s. It then holds there instead of pushing.
    max_position_error: 0.005
    stall_motion: 0.0005
    stall_time: 0.1

    # After a grasp is blocked, hold this much further closed than where it stopped. The actuator
    # builds effort on any error that stays: 0.5 mm reached ~1.9 A in attach_2.
    grasp_squeeze: 0.0005
    # A grasp stopping within this of close_value has grasped nothing
    empty_tolerance: 0.003

    # Motor current limit (A, absolute value). Over it for 'current_time' s while moving: stop
    # and hold there. Over it while holding: back the hold off by 'backoff_step' from what the
    # finger pushes on, up to 'max_backoff' in total.
    current_topic: /actuators_statistics/values
    current_statistic: gripper.*current
    max_current: 2.0        # +-2A
    current_time: 0.05
    backoff_step: 0.0005
    max_backoff: 0.005

    # Give up this long (in s) after the opening/closing time: hold where it is
    timeout: 4.0

    # Fastest commanded finger speed (joint units/s).
    max_speed: 0.03

    # Publishing rate (of grasp state) - (in hz)
    rate: 1.0

    # Time for which to open/close the gripper
    opening_time: 0.5
    closing_time: 1.5

    # Open/closed joint value for pal-pro-gripper
    open_value: [0.077]
    close_value: [0.0]

